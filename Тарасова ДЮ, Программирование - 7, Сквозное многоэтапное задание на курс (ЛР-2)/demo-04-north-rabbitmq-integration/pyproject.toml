[project]
name = "north-rabbitmq-integration"
version = "0.1.0"
description = "Стадия 04: Outbox, Inbox и RabbitMQ"
requires-python = ">=3.12,<3.13"
dependencies = ["pika>=1.3.2"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"